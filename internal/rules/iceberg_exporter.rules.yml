# Table health rules for iceberg_exporter.
#
# Every check records into one series name:
#
#   iceberg_table_problem{catalog, namespace, table, problem, severity}
#
# A series exists only while the problem is present. Its value is the
# measured quantity (an age in seconds, a ratio, a count), so problems can be
# sorted by how bad they are. Useful queries:
#
#   iceberg_table_problem                                     # every table/problem pair
#   count by (problem, severity) (iceberg_table_problem)      # tables per problem
#   count by (catalog, namespace, table) (iceberg_table_problem)  # worst tables
#
# Thresholds marked "tune" are starting points. Copy this file and adjust
# them, or add label matchers (e.g. {namespace!~"raw.*"}) to scope a check.
#
# Tables whose latest collection failed keep their previous stats, so their
# other problems reflect the last good state; scrape_failing makes that
# visible.

groups:
  - name: iceberg-table-problems
    interval: 1m
    rules:
      # --- Collection --------------------------------------------------------

      # The exporter could not read the table (permissions, missing manifest,
      # corrupt metadata). Value: 0.
      - record: iceberg_table_problem
        expr: iceberg_table_scrape_success == 0
        labels: {problem: scrape_failing, severity: warning}

      # --- Snapshot retention -----------------------------------------------

      # Snapshot expiration is not running: the oldest retained snapshot is
      # well past the table's own retention age. Value: oldest snapshot age
      # in seconds. Tune: the 2x grace factor.
      - record: iceberg_table_problem
        expr: |
          (time() - iceberg_table_oldest_snapshot_timestamp_seconds)
            > on (catalog, namespace, table) 2 * iceberg_table_setting_snapshot_max_age_seconds
          and on (catalog, namespace, table)
            iceberg_table_snapshot_count > on (catalog, namespace, table) iceberg_table_setting_min_snapshots_to_keep
          and on (catalog, namespace, table)
            iceberg_table_setting_gc_enabled == 1
        labels: {problem: snapshots_not_expired, severity: warning}

      # Snapshot count large enough to bloat metadata.json. Value: snapshot
      # count. Tune: 1000.
      - record: iceberg_table_problem
        expr: iceberg_table_snapshot_count > 1000
        labels: {problem: too_many_snapshots, severity: warning}

      # A non-main branch or tag points at an old snapshot, pinning its data
      # files (history.expire.max-ref-age-ms defaults to forever). Value: age
      # of the oldest ref's snapshot in seconds. Tune: 30 days.
      - record: iceberg_table_problem
        expr: time() - min without (type) (iceberg_table_oldest_ref_snapshot_timestamp_seconds) > 30 * 86400
        labels: {problem: stale_refs, severity: warning}

      # Old metadata.json files are not deleted on commit and the metadata log
      # is full, so every new commit orphans a metadata file. Value: metadata
      # log entries.
      - record: iceberg_table_problem
        expr: |
          iceberg_table_metadata_log_entries
            >= on (catalog, namespace, table) iceberg_table_setting_metadata_previous_versions_max
          and on (catalog, namespace, table)
            iceberg_table_setting_metadata_delete_after_commit_enabled == 0
        labels: {problem: metadata_files_not_cleaned, severity: warning}

      # Garbage collection (snapshot expiration, orphan removal) is disabled.
      # Value: 0.
      - record: iceberg_table_problem
        expr: iceberg_table_setting_gc_enabled == 0
        labels: {problem: gc_disabled, severity: info}

      # --- File layout -------------------------------------------------------

      # Too many small data files. Value: small-file ratio. Tune: 0.3 ratio,
      # minimum 100 files, and the small-file size: any file_size_bytes bucket
      # bound (1, 4, 16, 64, 256, 512 MiB, ...), written the way the exporter
      # renders it, e.g. le="6.7108864e+07" for 64 MiB.
      - record: iceberg_table_problem
        expr: |
          sum without (le) (iceberg_table_file_size_bytes_bucket{le="6.7108864e+07"})
            / clamp_min(iceberg_table_data_files, 1) > 0.3
          and on (catalog, namespace, table)
            iceberg_table_data_files > 100
        labels: {problem: small_files, severity: warning}

      # Too many manifests slow down query planning. Value: manifest count.
      # Tune: 1000.
      - record: iceberg_table_problem
        expr: iceberg_table_manifests > 1000
        labels: {problem: too_many_manifests, severity: warning}

      # Automatic manifest merging on commit is disabled. Value: 0.
      - record: iceberg_table_problem
        expr: iceberg_table_setting_manifest_merge_enabled == 0
        labels: {problem: manifest_merge_disabled, severity: info}

      # --- Row-level deletes -------------------------------------------------

      # Deletes accumulate faster than compaction removes them. Value: delete
      # records / data records. Tune: 0.1 ratio, minimum 10 delete files.
      - record: iceberg_table_problem
        expr: |
          iceberg_table_delete_records / clamp_min(iceberg_table_data_records, 1) > 0.1
          and on (catalog, namespace, table)
            iceberg_table_delete_files > 10
        labels: {problem: delete_file_buildup, severity: warning}

      # Equality deletes are the most expensive delete kind to read. Value:
      # equality delete files. Tune: 100.
      - record: iceberg_table_problem
        expr: max without (type) (iceberg_table_delete_files_by_type{type="equality"}) > 100
        labels: {problem: equality_deletes, severity: warning}

      # The table needs compaction (has delete files, or many small files) but
      # no replace snapshot from the last 7 days is retained. Value: delete
      # files, or the small-file ratio when there are none. Tune: 7 days and
      # the small_files thresholds.
      - record: iceberg_table_problem
        expr: |
          (
              iceberg_table_delete_files > 0
            or on (catalog, namespace, table)
              (
                sum without (le) (iceberg_table_file_size_bytes_bucket{le="6.7108864e+07"})
                  / clamp_min(iceberg_table_data_files, 1) > 0.3
                and on (catalog, namespace, table)
                  iceberg_table_data_files > 100
              )
          )
          unless on (catalog, namespace, table)
            time() - iceberg_table_last_operation_timestamp_seconds{operation="replace"} < 7 * 86400
        labels: {problem: compaction_overdue, severity: warning}

      # --- Partitioning ------------------------------------------------------

      # One partition is much larger than the average. Value: largest
      # partition / average partition. Tune: 10x, minimum 10 partitions.
      - record: iceberg_table_problem
        expr: |
          iceberg_table_partition_bytes_max
            / clamp_min(iceberg_table_data_bytes / clamp_min(iceberg_table_partitions, 1), 1)
            > 10
          and on (catalog, namespace, table)
            iceberg_table_partitions > 10
        labels: {problem: partition_skew, severity: warning}

      # Many tiny partitions. Value: partition count. Tune: 1000 partitions,
      # 64 MiB average.
      - record: iceberg_table_problem
        expr: |
          iceberg_table_partitions > 1000
          and on (catalog, namespace, table)
            iceberg_table_data_bytes / clamp_min(iceberg_table_partitions, 1) < 64 * 1024 * 1024
        labels: {problem: over_partitioned, severity: warning}

      # A single partition holds too many files. Value: files in the largest
      # partition. Tune: 1000.
      - record: iceberg_table_problem
        expr: iceberg_table_partition_files_max > 1000
        labels: {problem: hot_partition_files, severity: warning}

      # Partition tracking hit scrape.partitions.max_tracked; partition
      # distributions for this table are approximate. Value: 1.
      - record: iceberg_table_problem
        expr: iceberg_table_partition_tracking_truncated == 1
        labels: {problem: partition_tracking_truncated, severity: info}

      # --- Format and statistics ---------------------------------------------

      # Format v1 tables lack row-level deletes and sequence numbers. Value: 1.
      - record: iceberg_table_problem
        expr: iceberg_table_format_version == 1
        labels: {problem: format_v1, severity: info}

      # Large table without column statistics for the current snapshot, so
      # engines cannot use NDV-based cost estimates. Value: data bytes.
      # Tune: 100 GiB.
      - record: iceberg_table_problem
        expr: |
          iceberg_table_data_bytes > 100 * 1024 * 1024 * 1024
          and on (catalog, namespace, table)
            iceberg_table_current_snapshot_has_statistics == 0
        labels: {problem: missing_statistics, severity: info}

  - name: iceberg-table-alerts
    interval: 1m
    rules:
      - record: iceberg:tables_with_problem:count
        expr: count by (problem, severity) (iceberg_table_problem)

      - alert: IcebergTableProblem
        expr: iceberg_table_problem{severity=~"warning|critical"}
        for: 1h
        annotations:
          summary: "Iceberg table {{ $labels.catalog }}/{{ $labels.namespace }}.{{ $labels.table }}: {{ $labels.problem }}"
          description: "Problem {{ $labels.problem }} has been present for 1h (value {{ $value }})."
