# Example configuration for iceberg_exporter.
#
# ${VAR} placeholders in values are expanded from the environment after the
# file is parsed, so secrets are taken verbatim. Use $$ for a literal dollar
# sign. Unset variables are an error. Comments are never expanded.

listen: ":8080"
log:
  level: info
  format: logfmt

catalogs:
  prod:
    type: rest
    uri: https://iceberg.example.com
    warehouse: s3://lake/warehouse
    credential: ${ICEBERG_CREDENTIAL}
    properties:
      s3.region: eu-west-1

scrape:
  interval: 5m
  timeout: 4m
  concurrency: 4 # tables collected in parallel, across all catalogs

  # Defaults for every catalog; scrape.catalogs.<name>.manifests overrides
  # individual fields.
  manifests:
    enabled: true
    concurrency: 8

  partitions:
    # Upper bound on tracked partitions per table. Totals stay exact when
    # this is exceeded; partition distributions become approximate and
    # iceberg_table_partition_tracking_truncated becomes 1.
    max_tracked: 100000

  # Which catalogs to scrape, and how. Omit to scrape every catalog without
  # filters. When present, only the listed catalogs are scraped; a bare
  # "name:" or "name: {}" uses the defaults.
  catalogs:
    prod:
      namespaces:
        include: ["**"]
        exclude:
          - "tmp.**"
          - "**.staging"
      tables:
        exclude:
          - "**_staging"
      # manifests:
      #   enabled: false   # metadata-only metrics for this catalog
      #   concurrency: 16
