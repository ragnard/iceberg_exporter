name: Docker

# Builds the container image on every PR (without pushing) and publishes it to
# ghcr.io on pushes to main and on v* tags.
#
# Two variants are published:
#   ghcr.io/<owner>/<repo>:<tag>       default build (REST + Hive + S3)
#   ghcr.io/<owner>/<repo>:<tag>-full  all optional backends (Makefile ALL_TAGS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Image (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign attestations via Sigstore OIDC
      attestations: write # store build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            tags: ""
            suffix: ""
          - name: full
            tags: glue sql hadoop gcs azure sqlpgx sqlsqlite
            suffix: -full
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      # Go module/build caches for the Dockerfile's cache mounts:
      #   save    - pushes to main restore and save them
      #   restore - pull requests only read main's caches (no per-PR entries)
      #   none    - tag (release) builds always start from a clean state
      CACHE_MODE: ${{ github.event_name == 'pull_request' && 'restore' || (github.ref == 'refs/heads/main' && 'save' || 'none') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so `git describe` sees tags

      - name: Compute version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Fresh runners start with empty BuildKit cache mounts, so every build
      # would download all modules and compile every dependency. Persist the
      # mount contents via actions/cache and inject/extract them with
      # buildkit-cache-dance. The commit SHA in the key saves a fresh build
      # cache on every main push; restore-keys pick up the newest one.
      #
      # zizmor flags any cache in a workflow with a tag (release) trigger. Only
      # main pushes write this cache, PRs only read it (and main can never read
      # PR-scoped caches), and tag builds skip caching entirely.
      - name: Restore and save Go caches
        if: env.CACHE_MODE == 'save'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            go-mod
            go-build
          key: docker-go-${{ matrix.variant.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-go-${{ matrix.variant.name }}-${{ hashFiles('go.sum') }}-
            docker-go-${{ matrix.variant.name }}-

      - name: Restore Go caches
        if: env.CACHE_MODE == 'restore'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            go-mod
            go-build
          key: docker-go-${{ matrix.variant.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-go-${{ matrix.variant.name }}-${{ hashFiles('go.sum') }}-
            docker-go-${{ matrix.variant.name }}-

      # Must come after the cache step: post steps run in reverse, so the
      # caches are extracted from BuildKit before actions/cache saves them.
      - name: Inject Go caches into BuildKit
        if: env.CACHE_MODE != 'none'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "go-mod": "/go/pkg/mod",
              "go-build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ env.CACHE_MODE != 'save' }}

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=long
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            TAGS=${{ matrix.variant.tags }}
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
